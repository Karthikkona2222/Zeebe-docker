name: Deploy to QA

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy on QA server
  run: |
    set -e
    whoami
    hostname

    cd /home/karthik

    if [ ! -d "HealthCare" ]; then
      git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/AshwiniMallela/HealthCare.git
    fi

    cd HealthCare
    git pull origin main

    cd docker
    docker compose down || true
    docker compose build
    docker compose up -d
